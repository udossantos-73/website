<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário de Colecionáveis - Pops & Hot Wheels</title>
    
    <style>
        /* --- ESTILOS GERAIS E DA TABELA --- */
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 20px; color: #333; }
        h1 { color: #007acc; text-align: center; margin-bottom: 30px; }
        .pop-inventory { width: 100%; border-collapse: collapse; margin-top: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); background-color: white; }
        .pop-inventory th, .pop-inventory td { border: 1px solid #ddd; padding: 12px 8px; text-align: left; }
        .pop-inventory th { background-color: #007acc; color: white; font-weight: bold; text-transform: uppercase; }
        .pop-inventory tbody tr:nth-child(even) { background-color: #f9f9f9; }
        .pop-inventory tbody tr:hover { background-color: #e9e9e9; }
        .pop-main-image { width: 50px; height: auto; cursor: pointer; border-radius: 4px; }

        /* --- ESTILOS DO MODAL --- */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.7); }
        .modal-content { background-color: #fefefe; margin: 5% auto; padding: 30px; border: 1px solid #888; width: 80%; max-width: 700px; border-radius: 8px; position: relative; animation-name: animatetop; animation-duration: 0.4s; }
        @keyframes animatetop { from {top:-300px; opacity:0} to {top:0; opacity:1} }
        .close-button { color: #aaa; float: right; font-size: 28px; font-weight: bold; }
        .close-button:hover, .close-button:focus { color: #000; text-decoration: none; cursor: pointer; }

        /* --- ESTILOS DO CARROSSEL (SLIDER) --- */
/* --- ESTILOS DO CARROSSEL (SLIDER) --- */
#modal-image-gallery {
    text-align: center;
    margin-bottom: 20px;
    position: relative; 
    overflow: hidden; 
    /* Adicionar uma altura máxima ao contentor para centralização vertical */
    max-height: 400px; /* Ajuste este valor conforme o tamanho desejado (50px extra para margem/padding) */
}

.carousel-container {
    display: flex; 
    transition: transform 0.4s ease-in-out; 
    width: 100%;
    /* Garantir que o container do slide se ajusta à altura do contentor pai */
    height: 100%; 
}

.carousel-slide {
    min-width: 100%; 
    box-sizing: border-box;
    display: flex;
    justify-content: center; /* Centraliza horizontalmente a imagem no slide */
    align-items: center; /* Centraliza verticalmente a imagem no slide */
    /* Garantir que o slide ocupa toda a altura */
    height: 100%; 
}

.carousel-slide img {
    max-width: 100%;
    height: auto;
    max-height: 350px; /* Limitação máxima da imagem */
    border: 1px solid #ddd;
    border-radius: 4px;
    /* Adicionar esta linha para garantir que a imagem não excede o espaço */
    display: block; 
}

.carousel-controls button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    padding: 10px 15px;
    background-color: rgba(0, 0, 0, 0.5);
    color: white;
    border: none;
    cursor: pointer;
    z-index: 10;
    font-size: 1.5em;
    user-select: none;
}

        #prev-slide { left: 10px; }
        #next-slide { right: 10px; }
        /* -------------------------------------- */

        /* Estes estilos não serão mais necessários, mas mantemos por precaução */
        #modal-details { padding: 0; border-top: none; font-size: 1.1em; }
        .modal-source-link { display: none; }
        
        /* --- RESPONSIVIDADE --- */
        @media (max-width: 600px) {
            .pop-inventory thead { display: none; }
            .pop-inventory, .pop-inventory tbody, .pop-inventory tr, .pop-inventory td { display: block; width: 100%; }
            .pop-inventory tr { margin-bottom: 10px; border: 1px solid #ccc; }
            .pop-inventory td { text-align: right; padding-left: 50%; position: relative; }
            .pop-inventory td::before { content: attr(data-label); position: absolute; left: 6px; width: 45%; padding-right: 10px; white-space: nowrap; font-weight: bold; text-align: left; }
        }
    </style>
</head>
<body>

    <h1>Inventário Detalhado da Coleção</h1>

    <table class="pop-inventory">
        <thead>
            <tr>
                <th>Marca</th>
                <th>Nome da Coleção</th>
                <th>Nº</th>
                <th>Loja/Status</th> 
                <th>Preço</th>
                <th>Data Compra</th>
                <th>Adquirido</th>
                <th>Imagem</th>
            </tr>
        </thead>
        <tbody id="inventory-body">
            <tr><td colspan="8">A carregar dados... Por favor aguarde.</td></tr>
        </tbody>
    </table>

    <div id="pop-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeModal()">&times;</span>
            <h2 id="modal-title"></h2>
            
            <div id="modal-image-gallery">
                <div class="carousel-container" id="carousel-container">
                    </div>
                <div class="carousel-controls">
                    <button id="prev-slide" onclick="changeSlide(-1)">&#10094;</button>
                    <button id="next-slide" onclick="changeSlide(1)">&#10095;</button>
                </div>
            </div>
            </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script>
        // Variáveis globais para o slider
        let currentSlideIndex = 0;
        let slideCount = 0;

        // -------------------------------------------------------
        // 1. CONFIGURAÇÃO E INICIALIZAÇÃO DO FIREBASE
        // -------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyCDbqy7cBEBkIkhiD4dzbhVKq4leduVEYE",
            authDomain: "miguel-inventory.firebaseapp.com",
            projectId: "miguel-inventory",
            storageBucket: "miguel-inventory.firebasestorage.app",
            messagingSenderId: "277968569414",
            appId: "1:277968569414:web:04884bc1932c2c7db6b647"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        const COLLECTION_NAME = "inventario"; 

        // -------------------------------------------------------
        // 2. FUNÇÕES DO SLIDER
        // -------------------------------------------------------
        
        function showSlide(n) {
            const container = document.getElementById('carousel-container');
            
            if (n >= slideCount) { currentSlideIndex = 0; }
            if (n < 0) { currentSlideIndex = slideCount - 1; }
            
            const offset = currentSlideIndex * 100;
            container.style.transform = `translateX(-${offset}%)`;

            const prevBtn = document.getElementById('prev-slide');
            const nextBtn = document.getElementById('next-slide');

            if (slideCount <= 1) {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'block';
                nextBtn.style.display = 'block';
            }
        }

        function changeSlide(n) {
            showSlide(currentSlideIndex += n);
        }

        // -------------------------------------------------------
        // 3. FUNÇÕES DE FORMATAÇÃO (Mantidas, mas não usadas no modal)
        // -------------------------------------------------------

        function formatCurrency(value) {
            if (value === 0) return 'OF.'; 
            if (typeof value !== 'number') return 'N/A';
            return new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' }).format(value);
        }

        function formatDate(timestamp) {
            if (!timestamp || !timestamp.toDate) return 'N/A';
            const date = timestamp.toDate();
            return new Intl.DateTimeFormat('pt-PT', { year: 'numeric', month: 'short', day: '2-digit' }).format(date);
        }

        function translateBoolean(value) {
            if (value === undefined || value === null) return 'Não'; 
            return value === true ? 'Sim' : 'Não';
        }
        
        // -------------------------------------------------------
        // 4. FUNÇÃO DE CONTROLO DO MODAL
        // -------------------------------------------------------

        function closeModal() {
            document.getElementById('pop-modal').style.display = 'none';
            currentSlideIndex = 0;
            slideCount = 0;
        }

        function openModal(itemId, itemName) {
            
            db.collection(COLLECTION_NAME).doc(itemId).get().then((doc) => {
                if (!doc.exists) {
                    alert("Detalhes do item não encontrados!");
                    return;
                }

                const item = doc.data();
                const carouselContainer = document.getElementById('carousel-container');
                carouselContainer.innerHTML = ''; 
                
                currentSlideIndex = 0;
                slideCount = 0;

                // 1. Título
                document.getElementById('modal-title').innerText = `${itemName} (#${item.Numero || 'N/A'})`;

                // 2. Criação do Slider
                const images = item.Imagem;
                
                if (images && images.length > 0) {
                    slideCount = images.length;
                    
                    images.forEach((url, index) => {
                        const slideDiv = document.createElement('div');
                        slideDiv.className = 'carousel-slide';
                        // Usamos o nome da coleção como ALT text, pois os outros detalhes foram removidos
                        slideDiv.innerHTML = `<img src="${url}" alt="${itemName} - Imagem ${index + 1}">`;
                        carouselContainer.appendChild(slideDiv);
                    });
                    
                    carouselContainer.style.width = `${slideCount * 100}%`;

                } else {
                    carouselContainer.innerHTML = '<div class="carousel-slide"><p>Nenhuma imagem disponível.</p></div>';
                    slideCount = 1; 
                }
                
                showSlide(currentSlideIndex);

                // 3. REMOVEMOS A CRIAÇÃO DE detailsHtml

                // 4. Mostrar o Modal
                document.getElementById('pop-modal').style.display = 'block';

            }).catch(error => {
                console.error("Erro ao obter documento para modal:", error);
                alert("Não foi possível carregar os detalhes.");
            });
        }
        
        // --- ADICIONAR UM LISTENER PARA FECHAR O MODAL AO CLICAR FORA ---
        window.onclick = function(event) {
            const modal = document.getElementById('pop-modal');
            if (event.target == modal) {
                closeModal();
            }
        }


        // -------------------------------------------------------
        // 5. FUNÇÃO DE CARREGAMENTO DE INVENTÁRIO (Mantida inalterada)
        // -------------------------------------------------------

        function loadInventory() {
            const tableBody = document.getElementById('inventory-body');
            tableBody.innerHTML = '<tr><td colspan="8">A carregar dados...</td></tr>';

            db.collection(COLLECTION_NAME).get().then((querySnapshot) => {
                tableBody.innerHTML = ''; 
                
                querySnapshot.forEach((doc) => {
                    const item = doc.data(); 
                    const itemId = doc.id;   
                    
                    const row = tableBody.insertRow();
                    
                    const collectionName = item['Nom da Coleção'] || 'N/A';

                    row.innerHTML = `
                        <td data-label="Marca">${item.Marca || 'N/A'}</td>
                        <td data-label="Nome da Coleção">${collectionName}</td>
                        <td data-label="Nº">${item.Numero || 'N/A'}</td>
                        <td data-label="Loja/Status">${item.Loja || 'N/A'}</td>
                        <td data-label="Preço">${formatCurrency(item.Preço)}</td>
                        <td data-label="Data Compra">${formatDate(item.DataDeCompra)}</td>
                        <td data-label="Adquirido">${translateBoolean(item.Adquirido)}</td>
                        
                        <td data-label="Imagem">
                            <img src="${item.Imagem && item.Imagem.length > 0 ? item.Imagem[0] : 'https://via.placeholder.com/50'}"
                                 alt="${collectionName}"
                                 class="pop-main-image"
                                 onclick="openModal('${itemId}', '${collectionName}')"> 
                        </td>
                    `;
                });
            }).catch((error) => {
                console.error("Erro ao carregar o inventário: ", error);
                tableBody.innerHTML = '<tr><td colspan="8">Erro ao carregar os dados. Verifique a consola (F12).</td></tr>';
            });
        }

        // 6. INÍCIO: Chamar a função para preencher a tabela quando a página carregar
        window.onload = loadInventory;
    </script>

</body>
</html>
