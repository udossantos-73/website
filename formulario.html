<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Inventário - Miguel Inventory</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra Superior com Controlo de Autenticação -->
    <nav class="navbar navbar-dark bg-dark px-4 mb-4">
        <span class="navbar-brand mb-0 h1">Gestão de Inventário 🎮🚗🧱</span>
        <div id="auth-container">
            <button id="btn-login" class="btn btn-outline-light btn-sm" style="display:none;" onclick="loginGoogle()">Entrar com Google</button>
            <div id="user-info" class="text-white small" style="display:none;">
                <span id="user-name" class="me-2"></span>
                <button class="btn btn-outline-danger btn-sm" onclick="logoutGoogle()">Sair</button>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <!-- Botão para novo item -->
        <div class="d-flex justify-content-between mb-3">
            <button class="btn btn-primary" id="btn-novo" onclick="limparFormulario()">+ Novo Item</button>
            <a href="inventario.html" class="btn btn-outline-secondary">Ver Galeria / Site</a>
        </div>

        <div class="row">
            <!-- Coluna da Esquerda: Lista de Itens e Pesquisa por Número -->
            <div class="col-md-5 mb-4">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Lista de Itens</h5>
                    </div>
                    <div class="card-body">
                        <!-- Pesquisa por Número na Coleção -->
                        <div class="input-group mb-3">
                            <input type="number" id="input-pesquisa-num" class="form-control" placeholder="Nº na Coleção (ex: 686)">
                            <button class="btn btn-outline-primary" type="button" id="btn-pesquisar">Pesquisar</button>
                            <button class="btn btn-outline-secondary" type="button" id="btn-limpar-pesquisa" title="Limpar filtro">❌</button>
                        </div>
                        
                        <div class="list-group overflow-auto" id="lista-itens" style="max-height: 450px;">
                            <div class="text-center p-3 text-muted">A verificar autenticação...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Coluna da Direita: Formulário de Edição / Criação -->
            <div class="col-md-7">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0" id="form-titulo">Adicionar Novo Item</h5>
                    </div>
                    <div class="card-body">
                        <form id="item-form">
                            <input type="hidden" id="item-id">

                            <!-- Nome Na Colecao -->
                            <div class="mb-3">
                                <label for="NomeNaColecao" class="form-label">Nome na Coleção</label>
                                <input type="text" class="form-control" id="NomeNaColecao" required>
                            </div>

                            <div class="row">
                                <!-- Marca -->
                                <div class="col-md-6 mb-3">
                                    <label for="Marca" class="form-label">Marca</label>
                                    <select class="form-select" id="Marca" required>
                                        <option value="Lego">Lego</option>
                                        <option value="Funko Pop">Funko Pop</option>
                                        <option value="Hot Wheels">Hot Wheels</option>
                                    </select>
                                </div>

                                <!-- Estado (Dropdown com as 3 opções capitalizadas) -->
                                <div class="col-md-6 mb-3">
                                    <label for="Estado" class="form-label">Estado</label>
                                    <select class="form-select" id="Estado" required>
                                        <option value="Wishlist">Wishlist</option>
                                        <option value="Encomendado">Encomendado</option>
                                        <option value="Adquirido" selected>Adquirido</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <!-- Colecao (Tema) -->
                                <div class="col-md-6 mb-3">
                                    <label for="Colecao" class="form-label">Tema / Coleção (ex: Star Wars)</label>
                                    <input type="text" class="form-control" id="Colecao">
                                </div>

                                <!-- Tipo -->
                                <div class="col-md-6 mb-3">
                                    <label for="Tipo" class="form-label">Tipo (ex: Figura, Carro)</label>
                                    <input type="text" class="form-control" id="Tipo">
                                </div>
                            </div>

                            <div class="row">
                                <!-- Ano -->
                                <div class="col-md-4 mb-3">
                                    <label for="Ano" class="form-label">Ano</label>
                                    <input type="number" class="form-control" id="Ano">
                                </div>

                                <!-- NumeroItem -->
                                <div class="col-md-4 mb-3">
                                    <label for="NumeroItem" class="form-label">Nº do Item</label>
                                    <input type="number" class="form-control" id="NumeroItem">
                                </div>

                                <!-- NumeroNaColecao -->
                                <div class="col-md-4 mb-3">
                                    <label for="NumeroNaColecao" class="form-label">Nº na Coleção</label>
                                    <input type="number" class="form-control" id="NumeroNaColecao">
                                </div>
                            </div>

                            <div class="row">
                                <!-- Preço -->
                                <div class="col-md-4 mb-3">
                                    <label for="Preco" class="form-label">Preço (€)</label>
                                    <input type="number" step="0.01" class="form-control" id="Preco" value="0">
                                </div>

                                <!-- Valor Mercado -->
                                <div class="col-md-4 mb-3">
                                    <label for="ValorMercado" class="form-label">Valor de Mercado (€)</label>
                                    <input type="number" step="0.01" class="form-control" id="ValorMercado" value="0">
                                </div>

                                <!-- Quantidade -->
                                <div class="col-md-4 mb-3">
                                    <label for="Quantidade" class="form-label">Quantidade</label>
                                    <input type="number" class="form-control" id="Quantidade" value="1">
                                </div>
                            </div>

                            <div class="row">
                                <!-- Pertence -->
                                <div class="col-md-6 mb-3">
                                    <label for="Pertence" class="form-label">Pertence a</label>
                                    <input type="text" class="form-control" id="Pertence" value="Miguel">
                                </div>

                                <!-- Loja -->
                                <div class="col-md-6 mb-3">
                                    <label for="Loja" class="form-label">Loja</label>
                                    <input type="text" class="form-control" id="Loja">
                                </div>
                            </div>

                            <!-- Descricao -->
                            <div class="mb-3">
                                <label for="Descricao" class="form-label">Descrição</label>
                                <textarea class="form-control" id="Descricao" rows="2"></textarea>
                            </div>

                            <!-- Imagem -->
                            <div class="mb-3">
                                <label for="Imagem" class="form-label">Links das Imagens (URLs separadas por vírgula)</label>
                                <input type="text" class="form-control" id="Imagem" placeholder="https://..., https://...">
                            </div>

                            <!-- Botões de Submissão -->
                            <div class="d-flex justify-content-between">
                                <button type="button" class="btn btn-danger" id="btn-apagar" style="display:none;" onclick="apagarItem()">Eliminar Item</button>
                                <button type="submit" class="btn btn-success w-100" id="btn-guardar">Guardar Novo Item</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Lógica Firebase e Autenticação -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            projectId: "miguel-inventory"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let todosOsItens = [];

        window.loginGoogle = async function() {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Erro no login:", error);
                alert("Erro ao autenticar: " + error.message);
            }
        }

        window.logoutGoogle = async function() {
            await signOut(auth);
        }

        // Monitoriza a sessão do Google
        onAuthStateChanged(auth, (user) => {
            const btnLogin = document.getElementById('btn-login');
            const userInfo = document.getElementById('user-info');
            const userName = document.getElementById('user-name');

            if (user) {
                btnLogin.style.display = 'none';
                userInfo.style.display = 'block';
                userName.textContent = user.displayName || user.email;
                carregarListaItens();
            } else {
                btnLogin.style.display = 'block';
                userInfo.style.display = 'none';
                document.getElementById('lista-itens').innerHTML = '<div class="text-warning p-3 text-center">Clica em **Entrar com Google** no topo para aceder ao inventário.</div>';
            }
        });

        async function carregarListaItens() {
            const listaDiv = document.getElementById('lista-itens');
            listaDiv.innerHTML = '<div class="text-center p-3">A carregar inventário...</div>';
            
            try {
                const querySnapshot = await getDocs(collection(db, "inventario"));
                todosOsItens = [];
                querySnapshot.forEach((docSnap) => {
                    todosOsItens.push({ id: docSnap.id, ...docSnap.data() });
                });
                
                renderizarLista(todosOsItens);
            } catch (error) {
                console.error("Erro ao carregar inventário:", error);
                listaDiv.innerHTML = `<div class="text-danger p-3 small"><strong>Erro:</strong> ${error.message}</div>`;
            }
        }

        function renderizarLista(itens) {
            const listaDiv = document.getElementById('lista-itens');
            listaDiv.innerHTML = '';

            if (itens.length === 0) {
                listaDiv.innerHTML = '<div class="p-3 text-muted">Nenhum item encontrado.</div>';
                return;
            }

            itens.forEach(item => {
                const a = document.createElement('a');
                a.href = "#";
                a.className = "list-group-item list-group-item-action d-flex justify-content-between align-items-center";
                
                const numColecaoTexto = item.NumeroNaColecao !== undefined && item.NumeroNaColecao !== null ? `Nº ${item.NumeroNaColecao}` : '';
                
                a.innerHTML = `
                    <div>
                        <strong>${numColecaoTexto ? numColecaoTexto + ' - ' : ''}${item.NomeNaColecao || 'Sem Nome'}</strong><br>
                        <small class="text-muted">${item.Marca || ''} | ${item.Estado || 'Adquirido'}</small>
                    </div>
                    <span class="badge bg-primary rounded-pill">${item.Pertence || ''}</span>
                `;
                a.onclick = (e) => {
                    e.preventDefault();
                    preencherFormulario(item);
                };
                listaDiv.appendChild(a);
            });
        }

        // Pesquisa por Número na Coleção
        document.getElementById('btn-pesquisar').addEventListener('click', () => {
            const valPesquisa = document.getElementById('input-pesquisa-num').value.trim();
            if (!valPesquisa) {
                renderizarLista(todosOsItens);
                return;
            }

            const numProcurado = parseInt(valPesquisa);
            const filtrados = todosOsItens.filter(item => item.NumeroNaColecao === numProcurado);
            renderizarLista(filtrados);
        });

        document.getElementById('btn-limpar-pesquisa').addEventListener('click', () => {
            document.getElementById('input-pesquisa-num').value = '';
            renderizarLista(todosOsItens);
        });

        window.limparFormulario = function() {
            document.getElementById('item-form').reset();
            document.getElementById('item-id').value = '';
            document.getElementById('form-titulo').textContent = 'Adicionar Novo Item';
            document.getElementById('btn-guardar').textContent = 'Guardar Novo Item';
            document.getElementById('btn-apagar').style.display = 'none';
        }

        function preencherFormulario(item) {
            document.getElementById('item-id').value = item.id;
            document.getElementById('NomeNaColecao').value = item.NomeNaColecao || '';
            document.getElementById('Marca').value = item.Marca || 'Lego';
            document.getElementById('Estado').value = item.Estado || 'Adquirido';
            document.getElementById('Colecao').value = item.Colecao || '';
            document.getElementById('Tipo').value = item.Tipo || '';
            document.getElementById('Ano').value = item.Ano || '';
            document.getElementById('NumeroItem').value = item.NumeroItem || '';
            document.getElementById('NumeroNaColecao').value = item.NumeroNaColecao || '';
            document.getElementById('Preco').value = item.Preco || 0;
            document.getElementById('ValorMercado').value = item.ValorMercado || 0;
            document.getElementById('Quantidade').value = item.Quantidade || 1;
            document.getElementById('Pertence').value = item.Pertence || 'Miguel';
            document.getElementById('Loja').value = item.Loja || '';
            document.getElementById('Descricao').value = item.Descricao || '';
            
            if (Array.isArray(item.Imagem)) {
                document.getElementById('Imagem').value = item.Imagem.join(', ');
            } else {
                document.getElementById('Imagem').value = item.Imagem || '';
            }

            document.getElementById('form-titulo').textContent = 'Editar Item: ' + (item.NomeNaColecao || '');
            document.getElementById('btn-guardar').textContent = 'Atualizar Item';
            document.getElementById('btn-apagar').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('item-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('item-id').value;

            const imagensStr = document.getElementById('Imagem').value;
            const imagensArray = imagensStr ? imagensStr.split(',').map(s => s.trim()).filter(s => s.length > 0) : [];

            const dadosItem = {
                NomeNaColecao: document.getElementById('NomeNaColecao').value,
                Marca: document.getElementById('Marca').value,
                Estado: document.getElementById('Estado').value,
                Colecao: document.getElementById('Colecao').value,
                Tipo: document.getElementById('Tipo').value,
                Ano: parseInt(document.getElementById('Ano').value) || null,
                NumeroItem: parseInt(document.getElementById('NumeroItem').value) || null,
                NumeroNaColecao: parseInt(document.getElementById('NumeroNaColecao').value) || null,
                Preco: parseFloat(document.getElementById('Preco').value) || 0,
                ValorMercado: parseFloat(document.getElementById('ValorMercado').value) || 0,
                Quantidade: parseInt(document.getElementById('Quantidade').value) || 1,
                Pertence: document.getElementById('Pertence').value,
                Loja: document.getElementById('Loja').value,
                Descricao: document.getElementById('Descricao').value,
                Imagem: imagensArray,
                UltimaAtualizacaoValor: new Date().toISOString().split('T')[0]
            };

            try {
                if (id) {
                    await setDoc(doc(db, "inventario", id), dadosItem, { merge: true });
                    alert('Item atualizado com sucesso!');
                } else {
                    await addDoc(collection(db, "inventario"), dadosItem);
                    alert('Item criado com sucesso!');
                    limparFormulario();
                }
                carregarListaItens();
            } catch (error) {
                console.error("Erro ao guardar:", error);
                alert('Erro ao guardar o item.');
            }
        });

        window.apagarItem = async function() {
            const id = document.getElementById('item-id').value;
            if (!id) return;

            if (confirm('Tens a certeza de que queres eliminar este item?')) {
                try {
                    await deleteDoc(doc(db, "inventario", id));
                    alert('Item eliminado com sucesso!');
                    limparFormulario();
                    carregarListaItens();
                } catch (error) {
                    console.error("Erro ao apagar:", error);
                    alert('Erro ao apagar o item.');
                }
            }
        }
    </script>
</body>
</html>
