<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulário</title>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; background: #f2f2f2; }

    /* HEADER */
    header {
      position: relative;
      height: 40vh;
      min-height: 280px;
      background: url('https://i.imgur.com/O7EWNiI.jpeg') center / cover no-repeat fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      overflow: hidden;
      z-index: 1;
    }

    header::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
    }

    header h1 {
      position: relative;
      z-index: 2;
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 0;
      letter-spacing: 2px;
      text-shadow: 2px 2px 15px rgba(0,0,0,0.6);
    }

    /* MAIN FORMULÁRIO */
    main {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 620px;
      margin: 120px auto 50px;
      background: #ffffff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.15);
    }

    main h2 { text-align: center; margin-top: 0; }

    /* FORM */
    form { display: grid; gap: 14px; }
    input[type="text"], input[type="number"], input[type="date"], input[type="url"], textarea {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    textarea { resize: vertical; min-height: 80px; }
    button {
      background: #1f1f1f;
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
    }
    button:hover { background: #444; }

    /* SWITCHES */
    .checkbox-group {
      display: flex;
      gap: 30px;
      align-items: center;
      flex-wrap: wrap;
      grid-column: span 2;
    }

    .switch-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
    }

    .switch-container span.label-text {
      font-weight: 600;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 28px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 28px;
    }

    .slider::before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }

    .switch input:checked + .slider {
      background-color: #1f1f1f;
    }

    .switch input:checked + .slider::before {
      transform: translateX(22px);
    }

    /* TABLET */
    @media (min-width: 600px) {
      main { padding: 30px; }
      form { grid-template-columns: 1fr 1fr; }
      textarea, button, input[type="url"], .checkbox-group { grid-column: span 2; }
    }

    /* MOBILE FIX PARA background-attachment */
    @media (max-width: 768px) { header { background-attachment: scroll; } }
  </style>
</head>

<body>

<header>
  <h1>Formulário</h1>
</header>

<main>
  <h2>Adicionar item à coleção</h2>

  <form id="colecaoForm">
    <input type="text" id="colecao" placeholder="Coleção" required />
    <input type="text" id="nomeNaColecao" placeholder="Nome na Coleção" required />

    <input type="number" id="numeroNaColecao" placeholder="Número na Coleção" />
    <input type="text" id="marca" placeholder="Marca" />

    <input type="text" id="loja" placeholder="Loja" />
    <input type="number" step="0.01" id="preco" placeholder="Preço" />

    <input type="date" id="dataDeCompra" />

    <!-- SWITCHES COM LABEL VISÍVEL -->
    <div class="checkbox-group">
      <div class="switch-container">
        <span class="label-text">Colecionado:</span>
        <label class="switch">
          <input type="checkbox" id="colecionado">
          <span class="slider"></span>
        </label>
      </div>

      <div class="switch-container">
        <span class="label-text">Aquirido:</span>
        <label class="switch">
          <input type="checkbox" id="origem">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <textarea id="descricao" placeholder="Descrição"></textarea>

    <input type="url" id="imagem1" placeholder="Link da Imagem 1 (Imgur)" required />
    <input type="url" id="imagem2" placeholder="Link da Imagem 2 (Imgur)" required />

    <button type="submit">Salvar</button>
  </form>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, collection, addDoc, Timestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

// Configuração Firebase
const firebaseConfig = {
  apiKey: "AIzaSyCDbqy7cBEBkIkhiD4dzbhVKq4leduVEYE",
  authDomain: "miguel-inventory.firebaseapp.com",
  projectId: "miguel-inventory",
  storageBucket: "miguel-inventory.firebasestorage.app",
  messagingSenderId: "277968569414",
  appId: "1:277968569414:web:04884bc1932c2c7dbb6b647"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const form = document.getElementById("colecaoForm");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const imagem1 = document.getElementById("imagem1").value.trim();
  const imagem2 = document.getElementById("imagem2").value.trim();

  if (!imagem1 || !imagem2) {
    alert("Preencha os dois links das imagens.");
    return;
  }

  // Validação segura da data
  const dataCompraValue = document.getElementById("dataDeCompra").value;
  let dataCompraTimestamp = null;

  if (dataCompraValue) {
    const dataObj = new Date(dataCompraValue);
    if (!isNaN(dataObj.getTime())) {
      dataCompraTimestamp = Timestamp.fromDate(dataObj);
    } else {
      alert("Data inválida!");
      return;
    }
  }

  try {
    await addDoc(collection(db, "inventario"), {
      Colecao: document.getElementById("colecao").value,
      NomeNaColecao: document.getElementById("nomeNaColecao").value,
      NumeroNaColecao: Number(document.getElementById("numeroNaColecao").value),
      Descricao: document.getElementById("descricao").value,
      Marca: document.getElementById("marca").value,
      Loja: document.getElementById("loja").value,
      Preco: Number(document.getElementById("preco").value),
      Colecionado: document.getElementById("colecionado").checked,
      Origem: document.getElementById("origem").checked,
      DatadeCompra: dataCompraTimestamp,
      Imagem: [imagem1, imagem2]
    });

    alert("Item adicionado com sucesso!");
    form.reset();
  } catch (error) {
    console.error(error);
    alert("Erro ao salvar os dados.");
  }
});
</script>

</body>
</html>
