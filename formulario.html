<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerir Item - Inventário</title>
    <!-- Bootstrap CSS para um design limpo e responsivo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0" id="form-title">Adicionar Novo Item</h4>
                    </div>
                    <div class="card-body">
                        <form id="item-form">
                            
                            <!-- Nome na Coleção -->
                            <div class="mb-3">
                                <label for="NomeNaColecao" class="form-label">Nome do Item</label>
                                <input type="text" class="form-control" id="NomeNaColecao" required>
                            </div>

                            <div class="row">
                                <!-- Marca / Categoria -->
                                <div class="col-md-6 mb-3">
                                    <label for="Marca" class="form-label">Marca / Categoria</label>
                                    <select class="form-select" id="Marca" required>
                                        <option value="Lego">Lego</option>
                                        <option value="Funko Pop">Funko Pop</option>
                                        <option value="Hot Wheels">Hot Wheels</option>
                                    </select>
                                </div>

                                <!-- Estado (Wishlist, Encomendado, Adquirido) -->
                                <div class="col-md-6 mb-3">
                                    <label for="Estado" class="form-label">Estado</label>
                                    <select class="form-select" id="Estado" required>
                                        <option value="Wishlist">Wishlist</option>
                                        <option value="Encomendado">Encomendado</option>
                                        <option value="Adquirido" selected>Adquirido</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <!-- Sub-coleção / Tema (ex: Star Wars, F1) -->
                                <div class="col-md-6 mb-3">
                                    <label for="Colecao" class="form-label">Tema / Sub-coleção</label>
                                    <input type="text" class="form-control" id="Colecao">
                                </div>

                                <!-- Tipo (ex: Figura, Carro, Set) -->
                                <div class="col-md-6 mb-3">
                                    <label for="Tipo" class="form-label">Tipo</label>
                                    <input type="text" class="form-control" id="Tipo">
                                </div>
                            </div>

                            <div class="row">
                                <!-- Preço -->
                                <div class="col-md-4 mb-3">
                                    <label for="Preco" class="form-label">Preço (€)</label>
                                    <input type="number" step="0.01" class="form-control" id="Preco" value="0">
                                </div>

                                <!-- Quantidade -->
                                <div class="col-md-4 mb-3">
                                    <label for="Quantidade" class="form-label">Quantidade</label>
                                    <input type="number" class="form-control" id="Quantidade" value="1">
                                </div>

                                <!-- Pertence a -->
                                <div class="col-md-4 mb-3">
                                    <label for="Pertence" class="form-label">Pertence a</label>
                                    <input type="text" class="form-control" id="Pertence" value="Miguel">
                                </div>
                            </div>

                            <!-- Botões de Ação -->
                            <div class="d-flex justify-content-between mt-4">
                                <a href="inventario.html" class="btn btn-secondary">Voltar</a>
                                <button type="submit" class="btn btn-success" id="btn-salvar">Guardar Item</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Compat ou Modular conforme a tua estrutura, aqui em modo modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Configuração do teu projeto Firebase (Miguel Inventory)
        const firebaseConfig = {
            projectId: "miguel-inventory"
            // Podes adicionar aqui as restantes chaves se o teu site já as usar globalmente
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const itemId = urlParams.get('id'); // Se vier ?id=XYZ, estamos a editar

        const formTitle = document.getElementById('form-title');
        const btnSalvar = document.getElementById('btn-salvar');
        const form = document.getElementById('item-form');

        // Se houver um ID, carregar dados para edição
        if (itemId) {
            formTitle.textContent = "Editar Item do Inventário";
            btnSalvar.textContent = "Atualizar Item";
            
            async function carregarDadosItem() {
                const docRef = doc(db, "inventario", itemId);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('NomeNaColecao').value = data.NomeNaColecao || '';
                    document.getElementById('Marca').value = data.Marca || 'Lego';
                    document.getElementById('Estado').value = data.Estado || 'Adquirido';
                    document.getElementById('Colecao').value = data.Colecao || '';
                    document.getElementById('Tipo').value = data.Tipo || '';
                    document.getElementById('Preco').value = data.Preco || 0;
                    document.getElementById('Quantidade').value = data.Quantidade || 1;
                    document.getElementById('Pertence').value = data.Pertence || 'Miguel';
                }
            }
            carregarDadosItem();
        }

        // Submeter o formulário (Inserir ou Atualizar)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const dadosItem = {
                NomeNaColecao: document.getElementById('NomeNaColecao').value,
                Marca: document.getElementById('Marca').value,
                Estado: document.getElementById('Estado').value,
                Colecao: document.getElementById('Colecao').value,
                Tipo: document.getElementById('Tipo').value,
                Preco: parseFloat(document.getElementById('Preco').value) || 0,
                Quantidade: parseInt(document.getElementById('Quantidade').value) || 1,
                Pertence: document.getElementById('Pertence').value,
                UltimaAtualizacaoValor: new Date().toISOString().split('T')[0]
            };

            try {
                if (itemId) {
                    // Atualizar item existente
                    await setDoc(doc(db, "inventario", itemId), dadosItem, { merge: true });
                    alert('Item atualizado com sucesso!');
                } else {
                    // Criar novo item na coleção 'inventario'
                    await addDoc(collection(db, "inventario"), dadosItem);
                    alert('Item adicionado com sucesso!');
                }
                window.location.href = 'inventario.html'; // Redireciona para a página principal
            } catch (error) {
                console.error("Erro ao guardar o item: ", error);
                alert('Erro ao guardar o item. Consulta a consola.');
            }
        });
    </script>
</body>
</html>
