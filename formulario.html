<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Inventário - Miguel Inventory</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon-lego-face.svg">
    <link rel="icon" type="image/png" sizes="180x180" href="images/favicon-lego-face.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicon-lego-face.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
    <style>
        :root {
            --primary-blue: #0088cc;
            --primary-blue-hover: #0073ad;
            --slate-btn: #6c7a89;
            --slate-btn-hover: #5a6673;
            --bg-page: #f4f7f6;
            --border-subtle: #e2e8f0;
        }

        body {
            background-color: var(--bg-page) !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #2d3748;
        }

        /* Cabeçalho estilo Inventário da Coleção */
        .top-header {
            padding: 1.25rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .btn-portal {
            background-color: var(--slate-btn);
            color: #fff;
            border: none;
            font-weight: 500;
            padding: 0.45rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            transition: background-color 0.15s;
        }

        .btn-portal:hover {
            background-color: var(--slate-btn-hover);
            color: #fff;
        }

        .page-title {
            color: var(--primary-blue);
            font-weight: 700;
            font-size: 1.85rem;
            margin: 0;
            text-align: center;
        }

        /* Linha do Título + Menu Hambúrguer */
        .title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .menu-container {
            position: relative;
            flex-shrink: 0;
        }

        .hamburger-btn {
            background: transparent;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
            color: #333;
            padding: 4px 6px;
            line-height: 1;
            display: flex;
            align-items: center;
        }

        /* Nome "nav-menu" para não colidir com a classe .dropdown-menu do Bootstrap */
        .nav-menu {
            display: none;
            position: absolute;
            left: 0;
            top: 38px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border: 1px solid #e2e8f0;
            width: 220px;
            z-index: 1000;
            overflow: hidden;
            text-align: left;
        }

        .nav-menu a {
            display: block;
            padding: 12px 16px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            border-bottom: 1px solid #f1f5f9;
            transition: background-color 0.2s;
        }

        .nav-menu a:hover { background-color: #f8fafc; }
        .nav-menu a.blue-link { color: #007acc; }
        .nav-menu a.add-link { color: #64748b; }

        /* Tabs / Secções */
        #tabs-marcas {
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            justify-content: center;
            gap: 0.3rem;
        }

        #tabs-marcas .nav-link {
            color: #4a5568;
            font-weight: 500;
            font-size: 0.9rem;
            border-radius: 6px;
            padding: 0.4rem 0.85rem;
        }

        #tabs-marcas .nav-link.active {
            background-color: var(--primary-blue);
            color: #fff;
        }

        #tabs-marcas .nav-link.active .badge {
            background-color: rgba(255, 255, 255, 0.25) !important;
            color: #fff;
        }

        /* Cartões e Cabeçalhos Azuis */
        .card {
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04) !important;
            overflow: hidden;
        }

        .card-header-blue {
            background-color: var(--primary-blue) !important;
            color: #fff !important;
            padding: 0.75rem 1.15rem;
            border-bottom: none;
        }

        /* Lista de Itens estilo Tabela Limpa */
        #lista-itens .list-group-item {
            border-left: none;
            border-right: none;
            border-color: #edf2f7;
            padding: 0.65rem 0.85rem;
            transition: background-color 0.12s;
        }

        #lista-itens .list-group-item:hover {
            background-color: #ebf8ff;
        }

        #lista-itens .list-group-item strong {
            color: var(--primary-blue);
        }

        .thumb-mini {
            width: 44px;
            height: 44px;
            object-fit: contain;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            padding: 2px;
            flex-shrink: 0;
        }

        /* Botões e Formulário */
        .btn-primary-blue {
            background-color: var(--primary-blue);
            border-color: var(--primary-blue);
            color: #fff;
            font-weight: 500;
        }

        .btn-primary-blue:hover {
            background-color: var(--primary-blue-hover);
            border-color: var(--primary-blue-hover);
            color: #fff;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 0.3rem;
        }

        .form-control, .form-select {
            border-color: #cbd5e0;
            border-radius: 6px;
            font-size: 0.92rem;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 0.2rem rgba(0, 136, 204, 0.18);
        }
    </style>
</head>
<body>

    <!-- Cabeçalho com menu hambúrguer -->
    <header class="container-fluid top-header">
        <div>
            <a href="index.html" class="btn-portal">← Voltar ao Portal</a>
        </div>

        <div class="title-row">
            <div id="menu-container" class="menu-container" style="display:none;">
                <button type="button" class="hamburger-btn" onclick="toggleMenu()" aria-label="Abrir menu">☰</button>
                <div id="nav-menu" class="nav-menu">
                    <a href="wishlist.html" class="blue-link">Wishlist</a>
                    <a href="galerias.html" class="blue-link">Galerias</a>
                    <a href="inventario.html" class="blue-link">Inventário</a>
                    <a href="formulario.html" class="add-link">Gerir Inventário</a>
                    <a href="estatisticas.html" id="admin-stats-btn" class="add-link" style="display:none;">Valor & Estatísticas</a>
                </div>
            </div>
            <h1 class="page-title">Gestão de Inventário</h1>
        </div>

        <div id="auth-container">
            <button id="btn-login" class="btn btn-primary-blue btn-sm" style="display:none;" onclick="loginGoogle()">Entrar com Google</button>
            <div id="user-info" class="small" style="display:none;">
                <span id="user-name" class="me-2 fw-semibold text-dark"></span>
                <button class="btn btn-danger btn-sm" onclick="logoutGoogle()">Sair</button>
            </div>
        </div>
    </header>

    <div class="container-fluid px-4 mb-5">
        <!-- Secções por Marca (Tabs) -->
        <div class="d-flex justify-content-center mb-3">
            <ul class="nav nav-pills bg-white p-2 rounded shadow-sm" id="tabs-marcas" role="tablist">
                <li class="nav-item" role="presentation
