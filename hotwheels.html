<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot Wheels - Catálogo de Coleções</title>

<!-- Fonte -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background-color: #f8f9fa;
    color: #333;
}

/* Header */
header {
    position: relative;
    height: 400px;
    background: url('https://i.imgur.com/mWjeyOR.jpeg') center center / cover no-repeat fixed;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
    overflow: hidden;
}
header::after {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.4);
}
header h1 {
    position: relative;
    font-size: 3em;
    z-index: 1;
    margin: 0;
    letter-spacing: 2px;
    text-shadow: 2px 2px 15px rgba(0,0,0,0.5);
}
@media (max-width: 768px) { 
    header { 
        /* Mantemos o tamanho, mas removemos o 'fixed' para o mobile entender o 'cover' */
        background-attachment: scroll !important; 
        background-position: center center;
    }
    header h1 { font-size: 2em; } 
}

@media (max-width: 480px) { 
    header { 
        height: 250px; 
        background-attachment: scroll !important;
    } 
    header h1 { font-size: 1.8em; } 
}

/* Cards */

.item-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    padding: 30px 20px;
}

.item-card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    padding: 10px;
    width: 200px;
	flex: 0 1 200px;
    cursor: pointer;
    text-align: center;
    transition: transform 0.2s;
}
.item-card:hover { 
	transform: translateY(-5px); 
}
	
.item-card img { 
	width: 100%; 
	border-radius: 5px; 
	margin-bottom: 10px; 
}

.item-card h3 {
	font-size: 1em; 
	margin: 0; 
	font-weight: 700; 
	color: #007acc; 
}

/* Modal */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0; top: 0;
    width: 100%; height: 100%;
    justify-content: center;
    align-items: center;
    background-color: rgba(0,0,0,0.7);
    overflow-y: auto;
}
.modal-content {
    background-color: #fefefe;
    padding: 20px;
    border-radius: 8px;
    max-width: 90%;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
}
.close-button {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
}
.close-button:hover { color: #000; }

/* Carousel */
.carousel-container {
    display: flex;
    transition: transform 0.4s ease-in-out;
    width: 100%;
    overflow: hidden;
    margin-bottom: 10px;
}
.carousel-viewport {
    width: 100%;
    overflow: hidden;
    position: relative;
}

.carousel-track {
    display: flex;
    transition: transform 0.4s ease-in-out;
}
.carousel-slide {
    min-width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.carousel-slide img {
    width: 100%;
    max-height: 70vh;
    object-fit: contain;
}
.carousel-controls button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    padding: 10px 15px;
    background-color: rgba(0,0,0,0.5);
    color: white;
    border: none;
    cursor: pointer;
    font-size: 1.5em;
    user-select: none;
}


#prev-slide { left: 10px; }
#next-slide { right: 10px; }

/* Slide counter */
#slide-counter {
    text-align: center;
    margin-bottom: 10px;
    font-weight: bold;
    color: #333;
}
</style>
</head>
<body>

<header>
    <h1>Hot Wheels</h1>
</header>

<div class="item-container" id="itemContainer"></div>

<!-- Modal -->
<div id="pop-modal" class="modal">
    <div class="modal-content">
        <span class="close-button" onclick="closeModal()">&times;</span>
        <h2 id="modal-title"></h2>
        <div id="modal-image-gallery">
            <div id="slide-counter"></div>
            <div class="carousel-track" id="carousel-track"></div>
            <div class="carousel-controls">
                <button id="prev-slide" onclick="changeSlide(-1)">&#10094;</button>
                <button id="next-slide" onclick="changeSlide(1)">&#10095;</button>
            </div>
        </div>
        <div id="modal-details"></div>
        <p class="modal-source-link"><span id="modal-source-status"></span></p>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCDbqy7cBEBkIkhiD4dzbhVKq4leduVEYE",
    authDomain: "miguel-inventory.firebaseapp.com",
    projectId: "miguel-inventory",
    storageBucket: "miguel-inventory.firebasestorage.app",
    messagingSenderId: "277968569414",
    appId: "1:277968569414:web:04884bc1932c2c7dbb6b647"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const itemContainer = document.getElementById('itemContainer');
let currentSlideIndex = 0;
let slideCount = 0;

// Carregar cards
// Pega os dados do Firestore
db.collection("inventario").where("Marca", "==", "Hot Wheels").get()
.then(snapshot => {
    const items = [];
    snapshot.forEach(doc => {
        const data = doc.data();
        data.id = doc.id; // guarda o ID do documento
        items.push(data);
    });

    // Ordena os itens: primeiro por Colecao (alfabética), depois por NumeroNaColecao (numérico)
    items.sort((a, b) => {
        const colA = (a.Colecao || '').toLowerCase();
        const colB = (b.Colecao || '').toLowerCase();
        if (colA < colB) return -1;
        if (colA > colB) return 1;

        const numA = a.NumeroNaColecao || 0;
        const numB = b.NumeroNaColecao || 0;
        return numA - numB;
    });

    // Criar os cards ordenados
    items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        const title = `${item.Colecao || 'Item'} (#${item.NumeroNaColecao || 'N/A'})`;
        card.onclick = () => openModal(item.id, title);

        const mainImage = item.Imagem && item.Imagem.length > 0 ? item.Imagem[0] : 'https://via.placeholder.com/200';
        card.innerHTML = `
            <img src="${mainImage}" alt="${item.Colecao}">
            <h3>${item.Colecao}</h3>
            <h3>${item.NumeroNaColecao || ''}</h3>
        `;
        itemContainer.appendChild(card);
    });
}).catch(console.error);

// Abrir modal
function openModal(itemId, itemName) {
    const track = document.getElementById('carousel-track');
    track.innerHTML = '';
    currentSlideIndex = 0;

    db.collection("inventario").doc(itemId).get()
    .then(doc => {
        if (!doc.exists) return;

        const item = doc.data();
        const images = Array.isArray(item.Imagem) ? item.Imagem : [];

        if (images.length > 0) {
            slideCount = images.length;

            images.forEach((url, index) => {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide';
                slide.innerHTML = `<img src="${url}" alt="${itemName} ${index+1}">`;
                track.appendChild(slide);
            });
        } else {
            slideCount = 1;
            track.innerHTML = `
                <div class="carousel-slide">
                    <p>Nenhuma imagem disponível</p>
                </div>`;
        }

        document.getElementById('modal-title').innerText = itemName;
        document.getElementById('pop-modal').style.display = 'flex';

        updateCarousel();
    });
}

function updateCarousel() {
    const track = document.getElementById('carousel-track');
    track.style.transform = `translateX(-${currentSlideIndex * 100}%)`;

    document.getElementById('prev-slide').style.display =
        slideCount > 1 ? 'block' : 'none';
    document.getElementById('next-slide').style.display =
        slideCount > 1 ? 'block' : 'none';
}

function changeSlide(step) {
    currentSlideIndex += step;

    if (currentSlideIndex < 0) currentSlideIndex = slideCount - 1;
    if (currentSlideIndex >= slideCount) currentSlideIndex = 0;

    updateCarousel();
}

function closeModal() {
    document.getElementById('pop-modal').style.display = 'none';
    document.getElementById('carousel-track').innerHTML = '';
    currentSlideIndex = 0;
    slideCount = 0;
}

// Fechar ao clicar fora
window.onclick = function(e) {
    if (e.target.id === 'pop-modal') closeModal();
};
</script>

</body>
</html>
