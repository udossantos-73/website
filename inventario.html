<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário de Colecionáveis - Pops & Hot Wheels</title>
    
    <style>
    /* --- ESTILOS GERAIS --- */
    body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 20px; color: #333; }
    h1 { color: #007acc; text-align: center; margin-bottom: 30px; }
    
    .filters-container { display: flex; gap: 15px; margin-bottom: 20px; justify-content: center; }
    .filters-container input, .filters-container select { padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 1rem; }

    /* --- ESTILOS DA TABELA (DESKTOP) --- */
    .pop-inventory { width: 100%; border-collapse: collapse; margin-top: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); background-color: white; }
    .pop-inventory th, .pop-inventory td { border: 1px solid #ddd; padding: 12px 8px; text-align: left; }
    .pop-inventory th { background-color: #007acc; color: white; font-weight: bold; text-transform: uppercase; }
    .pop-inventory tbody tr:nth-child(even) { background-color: #f9f9f9; }
    .pop-inventory tbody tr:hover { background-color: #e9e9e9; }
    
    .pop-main-image { width: 50px; height: auto; cursor: pointer; border-radius: 4px; display: block; margin: auto; }

    /* --- ESTILOS DO MODAL --- */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; justify-content: center; align-items: center; background-color: rgba(0,0,0,0.7); padding: 20px; }
    .modal-content { background-color: #fefefe; padding: 30px; border-radius: 8px; width: auto; max-width: 90%; max-height: 90vh; overflow-y: auto; position: relative; }
    .close-button { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
    
    /* --- CARROSSEL --- */
    .carousel-container { display: flex; transition: transform 0.4s ease-in-out; width: 100%; }
    .carousel-slide { flex: 0 0 100%; display: flex; justify-content: center; }
    .carousel-slide img { width: 100%; max-height: 70vh; object-fit: contain; }
    #modal-image-gallery { position: relative; width: 100%; overflow: hidden; }
    .carousel-controls button { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; padding: 15px; cursor: pointer; z-index: 10; }
    #prev-slide { left: 10px; } #next-slide { right: 10px; }

@media (max-width: 850px) {
    h1 { font-size: 1.5rem; }
    .filters-container { flex-direction: column; align-items: stretch; }

    /* 1. Manter o comportamento de tabela, mas garantir que ocupa a largura total */
    .pop-inventory {
        display: table !important; /* Reverte o 'block' */
        width: 100% !important;
        border-collapse: collapse;
        font-size: 13px; /* Diminuir um pouco a fonte para caber tudo */
    }

    /* 2. Garantir que o cabeçalho e linhas continuam a ser da tabela */
    .pop-inventory thead { display: table-header-group !important; }
    .pop-inventory tr { display: table-row !important; }
    
    /* 3. ESCONDER TODAS AS COLUNAS POR DEFEITO */
    .pop-inventory th, 
    .pop-inventory td { 
        display: none !important; 
        padding: 8px 4px;
        text-align: center;
        border-bottom: 1px solid #ddd;
    }

    /* 4. MOSTRAR APENAS AS COLUNAS ESSENCIAIS */
    /* Ajustamos a largura de cada uma para caberem bem lado a lado */
    .pop-inventory th[data-label="Imagem"], .pop-inventory td[data-label="Imagem"],
    .pop-inventory th[data-label="Marca"],  .pop-inventory td[data-label="Marca"],
    .pop-inventory th[data-label="Numero"], .pop-inventory td[data-label="Numero"],
    .pop-inventory th[data-label="Colecao"], .pop-inventory td[data-label="Colecao"] {
        display: table-cell !important;
    }

    /* 5. Ajustes específicos para as colunas visíveis */
    .pop-main-image {
        width: 50px; /* Imagem muito menor para caber na linha */
        height: auto;
    }

    /* Remover o 'before' que criava os títulos repetidos nos cards */
    .pop-inventory td::before { content: none !important; }
}
    </style>
</head>
<body>

<h1>Inventário Detalhado da Coleção</h1>
	
<div class="filters-container">
    <input type="text" id="searchColecao" placeholder="Filtrar por Coleção..." onkeyup="filterData()">
    <select id="searchMarca" onchange="filterData()">
        <option value="">Todas as Marcas</option>
        <option value="Funko Pop">Funko Pop</option>
        <option value="HotWheels">HotWheels</option>
    </select>
</div>

<table class="pop-inventory">
    <thead>
        <tr>
            <th>Marca</th>
            <th>Imagem</th>
            <th>Numero</th>
            <th>Coleção</th>
            <th>Nome</th>
            <th>Descrição</th>
            <th>Origem</th>
            <th>Loja</th> 
            <th>Preço</th>
            <th>Data Compra</th>
            <th>Colecionado</th>
        </tr>
    </thead>
    <tbody id="inventory-body">
        <tr><td colspan="11">A carregar dados...</td></tr>
    </tbody>
</table>

<div id="pop-modal" class="modal">
    <div class="modal-content">
        <span class="close-button" onclick="closeModal()">&times;</span>
        <h2 id="modal-title"></h2>
        <div id="modal-image-gallery">
            <div class="carousel-container" id="carousel-container"></div>
            <div class="carousel-controls">
                <button id="prev-slide" onclick="changeSlide(-1)">&#10094;</button>
                <button id="next-slide" onclick="changeSlide(1)">&#10095;</button>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
let allItems = [];
let currentSlideIndex = 0;
let slideCount = 0;

const firebaseConfig = {
    apiKey: "AIzaSyCDbqy7cBEBkIkhiD4dzbhVKq4leduVEYE",
    authDomain: "miguel-inventory.firebaseapp.com",
    projectId: "miguel-inventory",
    storageBucket: "miguel-inventory.firebasestorage.app",
    messagingSenderId: "277968569414",
    appId: "1:277968569414:web:04884bc1932c2c7dbb6b647"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COLLECTION_NAME = "inventario";


function formatCurrency(v) { return new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' }).format(v || 0); }
function formatDate(t) { return (t && t.toDate) ? new Intl.DateTimeFormat('pt-PT', { day: '2-digit', month: 'short', year: 'numeric' }).format(t.toDate()) : 'Desconhecida'; }
function translateOrigem(v) { return v === false ? 'Oferecido' : 'Adquirido'; }
function translateColecionado(v) { return v === true ? 'Sim' : 'Não'; }
function translateLoja(v) { return v ? v : 'Desconhecida'; }

function loadInventory() {
    db.collection(COLLECTION_NAME).get().then((snap) => {
        allItems = [];
        snap.forEach(doc => { let d = doc.data(); d.id = doc.id; allItems.push(d); });
        allItems.sort((a,b) => (a.Colecao || '').localeCompare(b.Colecao || '') || (a.NumeroNaColecao - b.NumeroNaColecao));
        renderTable(allItems);
    });
}

function renderTable(data) {
    const body = document.getElementById('inventory-body');
    body.innerHTML = '';
    data.forEach(item => {
        const row = body.insertRow();
        const img = (item.Imagem && item.Imagem[0]) ? item.Imagem[0] : 'https://via.placeholder.com/50';
		const valorLoja = item.Loja || item.loja;
		const valorPreco = item.Preço || item.Preco || item.preço || 0;
        row.innerHTML = `
            <td data-label="Marca">${item.Marca || 'N/A'}</td>
            <td data-label="Imagem"><img src="${img}" class="pop-main-image" onclick="openModal('${item.id}', '${(item.Colecao || '').replace(/'/g, "\\'")}')"></td>
            <td data-label="Numero">${item.NumeroNaColecao || 'N/A'}</td>
            <td data-label="Colecao">${item.Colecao || 'N/A'}</td>
            <td data-label="Nome">${item.NomeNaColecao || 'N/A'}</td>
            <td data-label="Descricao">${item.Descricao || 'N/A'}</td>
            <td data-label="Origem">${translateOrigem(item.Origem)}</td>
            <td data-label="Loja">${translateLoja(valorLoja)}</td>
            <td data-label="Preco">${formatCurrency(valorPreco)}</td>
            <td data-label="Data">${formatDate(item.DatadeCompra)}</td>
            <td data-label="Colecionado">${translateColecionado(item.Colecionado)}</td>
        `;
    });
}

function filterData() {
    const txt = document.getElementById('searchColecao').value.toLowerCase();
    const marca = document.getElementById('searchMarca').value;
    const filtered = allItems.filter(i => (i.Colecao || '').toLowerCase().includes(txt) && (marca === "" || i.Marca === marca));
    renderTable(filtered);
}

function openModal(id, name) {
    db.collection(COLLECTION_NAME).doc(id).get().then(doc => {
        const item = doc.data();
        document.getElementById('modal-title').innerText = item.Colecao || 'Detalhes';
        const cont = document.getElementById('carousel-container');
        cont.innerHTML = '';
        const imgs = item.Imagem || [];
        slideCount = imgs.length;
        imgs.forEach(url => {
            const d = document.createElement('div'); d.className = 'carousel-slide';
            d.innerHTML = `<img src="${url}">`; cont.appendChild(d);
        });
        currentSlideIndex = 0; showSlide(0);
        document.getElementById('pop-modal').style.display = 'flex';
    });
}

function showSlide(n) {
    slideCount = document.querySelectorAll('.carousel-slide').length;
    if (n >= slideCount) currentSlideIndex = 0;
    if (n < 0) currentSlideIndex = slideCount - 1;
    document.getElementById('carousel-container').style.transform = `translateX(-${currentSlideIndex * 100}%)`;
}

function changeSlide(n) { currentSlideIndex += n; showSlide(currentSlideIndex); }
function closeModal() { document.getElementById('pop-modal').style.display = 'none'; }

window.onload = loadInventory;
window.onclick = (e) => { if (e.target.className === 'modal') closeModal(); };
</script>

</body>
</html>
