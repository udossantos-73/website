<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria LEGO</title>
    
    <style>
    body { 
        font-family: Arial, sans-serif; 
        background-color: #f4f4f4; 
        margin: 20px; 
        color: #333; 
    }
    
    /* CABEÇALHO PARA DESKTOP */
    .header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        max-width: 1200px;
        margin-left: auto;
        margin-right: auto;
        padding: 0 10px;
    }

    h1 { color: #007acc; margin: 0; font-size: 1.8rem; }
    
    .back-btn {
        background-color: #64748b;
        color: white;
        padding: 10px 18px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: bold;
        font-size: 0.9rem;
        display: inline-block;
        text-align: center;
        transition: background-color 0.2s;
    }
    .back-btn:hover { background-color: #475569; }

    /* GRELHA DA GALERIA */
    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px;
        max-width: 1200px;
        margin: 0 auto;
        padding: 10px;
    }

    .gallery-item {
        background: #ffffff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .gallery-item:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    }

    /* Ajuste para não cortar as imagens */
    .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 8px;
        box-sizing: border-box;
        display: block;
    }

    /* RODAPÉ E PAGINAÇÃO */
    .footer-section {
        margin-top: 40px;
        margin-bottom: 30px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: 400px;
        margin-left: auto;
        margin-right: auto;
    }

    .load-more-btn {
        width: 100%;
        padding: 14px;
        font-size: 0.95rem;
        font-weight: bold;
        color: white;
        background-color: #10b981;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.2s;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .load-more-btn:hover { background-color: #059669; }

    .portal-btn {
        width: 100%;
        padding: 14px;
        font-size: 0.95rem;
        font-weight: bold;
        color: white;
        background-color: #007acc;
        border: none;
        border-radius: 6px;
        text-decoration: none;
        display: inline-block;
        box-sizing: border-box;
        transition: background-color 0.2s;
    }
    .portal-btn:hover { background-color: #005999; }

    .bottom-logout-btn {
        background: none;
        border: none;
        color: #dc3545;
        font-size: 0.85rem;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
        text-decoration: underline;
    }

    /* MODAL DETALHADO */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; justify-content: center; align-items: center; background-color: rgba(0,0,0,0.75); padding: 15px; box-sizing: border-box; }
    .card-modal-content { background-color: #fff; padding: 25px; border-radius: 12px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .close-button { position: absolute; top: 15px; right: 20px; color: #888; font-size: 28px; font-weight: bold; cursor: pointer; }
    .close-button:hover { color: #000; }

    .card-header { text-align: center; margin-bottom: 15px; padding-right: 20px; }
    .card-header h2 { margin: 5px 0; color: #007acc; font-size: 1.4rem; }
    .card-badge { display: inline-block; background: #fee2e2; color: #dc2626; font-size: 0.85rem; font-weight: bold; padding: 3px 10px; border-radius: 12px; margin-bottom: 5px; }

    .card-image-wrapper { position: relative; width: 100%; height: 260px; background: #fafafa; border-radius: 8px; border: 1px solid #eee; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }
    .card-image-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; }
    
    .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: none; font-size: 1.2rem; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; z-index: 5; }
    .nav-arrow:hover { background: rgba(0,0,0,0.9); }
    .nav-arrow.prev { left: 10px; }
    .nav-arrow.next { right: 10px; }

    .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 0.9rem; }
    .card-grid-item { display: flex; flex-direction: column; }
    .card-grid-item.full-width { grid-column: span 2; }
    .card-label { font-size: 0.75rem; color: #64748b; font-weight: bold; text-transform: uppercase; margin-bottom: 2px; }
    .card-value { color: #1e293b; font-weight: 500; }

    .card-item-navigation { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid #e2e8f0; }
    .nav-item-btn { background: #007acc; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
    .nav-item-btn:hover { background: #005999; }
    .nav-item-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .item-counter { font-size: 0.85rem; color: #64748b; font-weight: bold; }

    /* MODO TELEMÓVEL */
    @media (max-width: 600px) {
        body { margin: 10px; }
        .header-bar { flex-direction: column; text-align: center; gap: 12px; }
        .back-btn { width: 100%; box-sizing: border-box; }
        .gallery-grid { grid-template-columns: 1fr !important; gap: 15px; padding: 0; }
    }
    </style>
</head>
<body>

<div class="header-bar">
    <h1>Galeria LEGO</h1>
    <a href="galerias.html" class="back-btn">&larr; Voltar às Galerias</a>
</div>

<!-- GRELHA VISUAL -->
<div class="gallery-grid" id="gallery-container">
    <p style="text-align: center; grid-column: 1 / -1; color: #64748b;">A carregar coleção de LEGO...</p>
</div>

<!-- SECÇÃO FINAL DA PÁGINA -->
<div class="footer-section">
    <button id="load-more-btn" class="load-more-btn" onclick="carregarMaisItens()" style="display:none;">
        ➕ Carregar mais 10 imagens
    </button>
    <a href="index.html" class="portal-btn">&larr; Voltar ao Portal</a>
    <button class="bottom-logout-btn" onclick="logout()">Terminar Sessão</button>
</div>

<!-- MODAL DE CARTÃO DETALHADO -->
<div id="card-modal" class="modal">
    <div class="card-modal-content">
        <span class="close-button" onclick="closeCardModal()">&times;</span>
        
        <div class="card-header">
            <span class="card-badge" id="card-marca">LEGO</span>
            <h2 id="card-nome">Nome do Set</h2>
            <div style="font-size: 0.9rem; color: #64748b;">
                <span id="card-colecao">Tema</span> #<span id="card-numero">00</span>
            </div>
        </div>

        <div class="card-image-wrapper">
            <button class="nav-arrow prev" id="img-prev-btn" onclick="changeCardImage(-1)">&#10094;</button>
            <img id="card-img-display" src="" alt="Imagem do Item">
            <button class="nav-arrow next" id="img-next-btn" onclick="changeCardImage(1)">&#10095;</button>
        </div>

        <div class="card-grid">
            <div class="card-grid-item full-width">
                <span class="card-label">Descrição</span>
                <span class="card-value" id="card-descricao">N/A</span>
            </div>
            <div class="card-grid-item">
                <span class="card-label">Origem</span>
                <span class="card-value" id="card-origem">N/A</span>
            </div>
            <div class="card-grid-item">
                <span class="card-label">Loja</span>
                <span class="card-value" id="card-loja">N/A</span>
            </div>
            <div class="card-grid-item">
                <span class="card-label">Preço</span>
                <span class="card-value" id="card-preco">0,00 €</span>
            </div>
            <div class="card-grid-item">
                <span class="card-label">Data de Compra</span>
                <span class="card-value" id="card-data">N/A</span>
            </div>
            <div class="card-grid-item full-width">
                <span class="card-label">Na Coleção?</span>
                <span class="card-value" id="card-colecionado">Sim</span>
            </div>
        </div>

        <div class="card-item-navigation">
            <button class="nav-item-btn" id="prev-item-btn" onclick="navigateItem(-1)">&larr; Anterior</button>
            <span class="item-counter" id="item-counter">Item 1 de 10</span>
            <button class="nav-item-btn" id="next-item-btn" onclick="navigateItem(1)">Seguinte &rarr;</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>
let totalItems = [];
let itemsExibidos = 0;
const ITENS_POR_PAGINA = 10;

let currentItemIndex = 0;
let currentCardImages = [];
let currentCardImageIndex = 0;

const firebaseConfig = {
    apiKey: "AIzaSyCDbqy7cBEBkIkhiD4dzbhVKq4leduVEYE",
    authDomain: "miguel-inventory.firebaseapp.com",
    projectId: "miguel-inventory",
    storageBucket: "miguel-inventory.firebasestorage.app",
    messagingSenderId: "277968569414",
    appId: "1:277968569414:web:04884bc1932c2c7dbb6b647"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const COLLECTION_NAME = "inventario";

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

const authorizedEmails = [
    "ulisses.dos.santos@gmail.com",
    "urbino.sousa@gmail.com",
    "miguelabrantesdossantos@gmail.com"
];

function logout() {
    auth.signOut().then(() => { window.location.href = "index.html"; });
}

auth.onAuthStateChanged((user) => {
    if (user) {
        const userEmail = (user.email || "").toLowerCase().trim();
        if (authorizedEmails.includes(userEmail)) {
            loadLegoGallery();
        } else {
            alert("Acesso Negado! O e-mail (" + user.email + ") não tem permissão.");
            window.location.href = "index.html";
        }
    } else {
        setTimeout(() => {
            if (!auth.currentUser) {
                window.location.href = "index.html";
            }
        }, 1000);
    }
});

function formatCurrency(v) { return new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' }).format(v || 0); }
function formatDate(t) { return (t && t.toDate) ? new Intl.DateTimeFormat('pt-PT', { day: '2-digit', month: 'short', year: 'numeric' }).format(t.toDate()) : 'Desconhecida'; }
function translateOrigem(v) { return v === false ? 'Oferecido' : 'Adquirido'; }
function translateColecionado(v) { return v === true ? 'Sim' : 'Não'; }
function translateLoja(v) { return v ? v : 'Desconhecida'; }

function extrairImagens(data) {
    if (!data) return [];
    const chavesComuns = ['imagem', 'Imagem', 'foto', 'Foto', 'FotoUrl', 'URL', 'url'];
    for (const chave of chavesComuns) {
        const val = data[chave];
        if (!val) continue;

        if (Array.isArray(val) && val.length > 0) {
            return val.filter(item => typeof item === 'string' && item.trim().startsWith('http'));
        }
        
        if (typeof val === 'string' && val.trim().startsWith('http')) {
            return [val.trim()];
        }
    }
    return [];
}

function loadLegoGallery() {
    const container = document.getElementById('gallery-container');
    container.innerHTML = '<p style="text-align: center; grid-column: 1 / -1; color: #64748b;">A carregar dados do inventário...</p>';
    
    db.collection(COLLECTION_NAME).get().then((snap) => {
        totalItems = [];
        snap.forEach(doc => { 
            let d = doc.data(); 
            d.id = doc.id; 
            const marca = (d.Marca || '').toLowerCase();
            const tipo = (d.Tipo || '').toLowerCase();

            if (marca.includes('lego') || tipo.includes('lego') || tipo.includes('set')) {
                totalItems.push(d); 
            }
        });

        totalItems.sort((a,b) => (a.Colecao || a.Marca || '').localeCompare(b.Colecao || b.Marca || '') || (a.NumeroNaColecao - b.NumeroNaColecao));
        
        container.innerHTML = '';
        itemsExibidos = 0;
        
        if (totalItems.length === 0) {
            container.innerHTML = '<p style="text-align: center; grid-column: 1 / -1; color: #64748b;">Nenhum Set LEGO encontrado na coleção.</p>';
            document.getElementById('load-more-btn').style.display = 'none';
            return;
        }

        carregarMaisItens();
    }).catch(err => {
        console.error("Erro ao carregar Firestore:", err);
        container.innerHTML = '<p style="text-align: center; grid-column: 1 / -1; color: #dc3545;">Erro ao carregar dados da coleção.</p>';
    });
}

function carregarMaisItens() {
    const container = document.getElementById('gallery-container');
    const proximoLimite = Math.min(itemsExibidos + ITENS_POR_PAGINA, totalItems.length);

    for (let i = itemsExibidos; i < proximoLimite; i++) {
        const item = totalItems[i];
        const imgs = extrairImagens(item);
        const firstImg = imgs.length > 0 ? imgs[0] : 'https://via.placeholder.com/200?text=Sem+Imagem';
        const titleText = item.NomeNaColecao || item.Nome || item.Modelo || 'Set LEGO';

        const card = document.createElement('div');
        card.className = 'gallery-item';
        card.title = titleText;
        card.onclick = () => openCardModal(i);
        
        card.innerHTML = `<img src="${firstImg}" alt="${titleText}" loading="lazy">`;
        container.appendChild(card);
    }

    itemsExibidos = proximoLimite;

    const loadMoreBtn = document.getElementById('load-more-btn');
    if (itemsExibidos < totalItems.length) {
        loadMoreBtn.style.display = 'block';
        loadMoreBtn.innerText = `➕ Carregar mais 10 imagens (${itemsExibidos} de ${totalItems.length})`;
    } else {
        loadMoreBtn.style.display = 'none';
    }
}

function openCardModal(index) {
    currentItemIndex = index;
    displayCardData();
    document.getElementById('card-modal').style.display = 'flex';
}

function displayCardData() {
    const item = totalItems[currentItemIndex];
    if (!item) return;

    document.getElementById('card-marca').innerText = item.Marca || 'LEGO';
    document.getElementById('card-nome').innerText = item.NomeNaColecao || item.Nome || item.Modelo || 'Sem Nome';
    document.getElementById('card-colecao').innerText = item.Colecao || item.Tipo || 'LEGO';
    document.getElementById('card-numero').innerText = item.NumeroNaColecao || item.Numero || 'N/A';
    document.getElementById('card-descricao').innerText = item.Descricao || 'Sem descrição disponível.';
    document.getElementById('card-origem').innerText = translateOrigem(item.Origem);
    document.getElementById('card-loja').innerText = translateLoja(item.Loja || item.loja);
    document.getElementById('card-preco').innerText = formatCurrency(item.Preço || item.Preco || item.preço);
    document.getElementById('card-data').innerText = formatDate(item.DatadeCompra);
    document.getElementById('card-colecionado').innerText = translateColecionado(item.Colecionado);

    const imgs = extrairImagens(item);
    currentCardImages = imgs.length > 0 ? imgs : ['https://via.placeholder.com/300?text=Sem+Imagem'];
    currentCardImageIndex = 0;
    updateCardImageDisplay();

    document.getElementById('item-counter').innerText = `${currentItemIndex + 1} de ${totalItems.length}`;
    document.getElementById('prev-item-btn').disabled = (currentItemIndex === 0);
    document.getElementById('next-item-btn').disabled = (currentItemIndex === totalItems.length - 1);
}

function updateCardImageDisplay() {
    document.getElementById('card-img-display').src = currentCardImages[currentCardImageIndex];
    const showArrows = currentCardImages.length > 1;
    document.getElementById('img-prev-btn').style.display = showArrows ? 'flex' : 'none';
    document.getElementById('img-next-btn').style.display = showArrows ? 'flex' : 'none';
}

function changeCardImage(direction) {
    currentCardImageIndex += direction;
    if (currentCardImageIndex >= currentCardImages.length) currentCardImageIndex = 0;
    if (currentCardImageIndex < 0) currentCardImageIndex = currentCardImages.length - 1;
    updateCardImageDisplay();
}

function navigateItem(direction) {
    const newIndex = currentItemIndex + direction;
    if (newIndex >= 0 && newIndex < totalItems.length) {
        currentItemIndex = newIndex;
        displayCardData();
    }
}

function closeCardModal() {
    document.getElementById('card-modal').style.display = 'none';
}

window.onclick = (e) => {
    if (e.target.className === 'modal') closeCardModal();
};
</script>

</body>
</html>
