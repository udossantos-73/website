<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coleção & Inventário</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="auth-guard.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased min-h-screen flex flex-col">

  <!-- Navegação Superior com Menu Hambúrguer -->
  <nav class="bg-slate-900 text-white shadow-md relative z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
        📦 Coleção Privada
      </h1>

      <!-- Botão Hambúrguer -->
      <button id="menu-btn" class="p-2 rounded-lg text-gray-300 hover:text-white hover:bg-slate-800 focus:outline-none transition">
        <svg id="icon-open" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <svg id="icon-close" class="w-7 h-7 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Dropdown do Menu Hambúrguer -->
    <div id="dropdown-menu" class="hidden bg-slate-800 border-t border-slate-700 w-full absolute top-full left-0 shadow-xl">
      <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col gap-2">
        <a href="inventario.html" class="px-4 py-2.5 rounded-lg text-gray-200 hover:bg-slate-700 hover:text-white transition font-medium flex items-center gap-3">
          📋 Ver Inventário
        </a>
        <a href="estatisticas.html" class="px-4 py-2.5 rounded-lg text-gray-200 hover:bg-slate-700 hover:text-white transition font-medium flex items-center gap-3">
          📊 Estatísticas
        </a>
        <a href="funko.html" class="px-4 py-2.5 rounded-lg text-gray-200 hover:bg-slate-700 hover:text-white transition font-medium flex items-center gap-3">
          🧸 Funko Pop
        </a>
        <a href="hotwheels.html" class="px-4 py-2.5 rounded-lg text-gray-200 hover:bg-slate-700 hover:text-white transition font-medium flex items-center gap-3">
          🏎️ Hot Wheels
        </a>
        <a href="formulario.html" class="px-4 py-2.5 rounded-lg text-gray-200 hover:bg-slate-700 hover:text-white transition font-medium flex items-center gap-3">
          ➕ Adicionar Item
        </a>
      </div>
    </div>
  </nav>

  <!-- Conteúdo Principal com Imagem Aleatória -->
  <main class="flex-grow max-w-5xl mx-auto px-4 py-8 flex flex-col items-center justify-center w-full">
    
    <div class="w-full bg-white rounded-2xl shadow-lg border border-gray-200 overflow-hidden flex flex-col items-center p-6 sm:p-8">
      
      <div class="flex justify-between items-center w-full mb-6">
        <h2 class="text-xl sm:text-2xl font-bold text-slate-800">Destaque Aleatório da Coleção</h2>
        <button onclick="carregarImagemAleatoria()" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-lg transition flex items-center gap-1">
          🔄 Outro item
        </button>
      </div>

      <!-- Contentor da Imagem -->
      <div id="container-imagem" class="w-full max-w-md h-80 bg-gray-50 rounded-xl border border-gray-200 flex items-center justify-center relative overflow-hidden">
        <p id="status-carregamento" class="text-sm text-gray-400 font-medium">A escolher um item...</p>
        <img id="imagem-destaque" class="w-full h-full object-contain hidden" alt="Destaque da coleção">
      </div>

      <!-- Detalhes do Item Sortear -->
      <div id="detalhes-item" class="mt-6 text-center w-full min-h-[60px] flex flex-col items-center justify-center">
        <h3 id="nome-item" class="text-lg font-bold text-slate-800">--</h3>
        <p id="subtitulo-item" class="text-sm text-gray-500 mt-1">--</p>
      </div>

    </div>

  </main>

  <!-- Script de Controlo -->
  <script>
    // 1. Lógica do Menu Hambúrguer
    const menuBtn = document.getElementById('menu-btn');
    const dropdownMenu = document.getElementById('dropdown-menu');
    const iconOpen = document.getElementById('icon-open');
    const iconClose = document.getElementById('icon-close');

    menuBtn.addEventListener('click', () => {
      const isOpen = !dropdownMenu.classList.contains('hidden');
      if (isOpen) {
        dropdownMenu.classList.add('hidden');
        iconOpen.classList.remove('hidden');
        iconClose.classList.add('hidden');
      } else {
        dropdownMenu.classList.remove('hidden');
        iconOpen.classList.add('hidden');
        iconClose.classList.remove('hidden');
      }
    });

    // 2. Lógica de Obtenção da Imagem Aleatória
    async function carregarImagemAleatoria() {
      const db = firebase.firestore();
      const statusEl = document.getElementById('status-carregamento');
      const imgEl = document.getElementById('imagem-destaque');
      const nomeEl = document.getElementById('nome-item');
      const subEl = document.getElementById('subtitulo-item');

      statusEl.textContent = "A escolher um item...";
      statusEl.classList.remove('hidden');
      imgEl.classList.add('hidden');

      try {
        const snapshot = await db.collection('inventario').get();
        
        // Filtrar apenas documentos que tenham o campo Imagem (ou Foto) preenchido
        const itensComFoto = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          const urlFoto = data.Imagem || data.Foto || data.FotoUrl;
          if (urlFoto && typeof urlFoto === 'string' && urlFoto.trim() !== '') {
            itensComFoto.push({ id: doc.id, ...data, urlFoto });
          }
        });

        if (itensComFoto.length === 0) {
          statusEl.textContent = "Nenhum item com imagem encontrado no inventário.";
          nomeEl.textContent = "--";
          subEl.textContent = "--";
          return;
        }

        // Selecionar um elemento aleatório do array
        const itemSorteado = itensComFoto[Math.floor(Math.random() * itensComFoto.length)];

        // Atualizar os elementos na página
        imgEl.src = itemSorteado.urlFoto;
        imgEl.onload = () => {
          statusEl.classList.add('hidden');
          imgEl.classList.remove('hidden');
        };

        nomeEl.textContent = itemSorteado.NomeNaColecao || itemSorteado.Nome || itemSorteado.Modelo || 'Item sem nome';
        
        const marca = itemSorteado.Marca || 'Coleção';
        const numero = itemSorteado.NumeroNaColecao ? `#${itemSorteado.NumeroNaColecao}` : '';
        subEl.textContent = `${marca} ${numero}`.trim();

      } catch (err) {
        console.error("Erro ao carregar imagem aleatória:", err);
        statusEl.textContent = "Erro ao carregar o destaque.";
      }
    }

    // Inicialização ao carregar a página
    document.addEventListener('DOMContentLoaded', () => {
      firebase.auth().onAuthStateChanged(user => {
        if (user) {
          carregarImagemAleatoria();
        }
      });
    });
  </script>

</body>
</html>
