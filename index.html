<style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f4; }
    h1 { color: #007acc; }

    /* ======================================================= */
    /* --- GRID LAYOUT: 3 COLUNAS EM ECRÃS GRANDES --- */
    /* ======================================================= */
    .nav-container { 
        margin-top: 30px; 
        max-width: 1000px; /* Limita a largura do grid */
        margin-left: auto;
        margin-right: auto;
        display: grid;
        
        /* NOVO: Define 3 colunas de largura igual (1fr) */
        grid-template-columns: repeat(3, 1fr); 
        gap: 20px; /* Espaço entre os botões */
        padding: 0 20px;
    }

    /* Estilo do Botão/Área de Link */
    .nav-button {
        /* As propriedades display: flex, width e height são essenciais para manter o tamanho uniforme no grid */
        padding: 10px; 
        text-decoration: none;
        background-color: white; 
        border: 2px solid #ccc;
        border-radius: 8px;
        width: 100%; /* Ocupa o espaço total da célula do grid */
        height: 150px; /* Altura fixa (pode ajustar) */
        
        display: flex;
        align-items: center; 
        justify-content: center;
        
        transition: border-color 0.3s, box-shadow 0.3s;
    }
    
    .nav-button:hover {
        border-color: #007acc; 
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    
    /* Estilo para a Imagem do Logo */
    .logo-img {
        max-width: 100%; 
        max-height: 100%; 
        width: auto;
        height: auto;
        display: block; 
        object-fit: contain;
        filter: brightness(1) contrast(100%); /* Mantém filtro anti-artefactos */
    }

    /* ======================================================= */
    /* --- MEDIA QUERY: Volta a 1 Coluna em Telemóveis --- */
    /* ======================================================= */
    @media (max-width: 768px) {
        .nav-container {
            /* Em ecrãs pequenos (telemóveis), volta a ter apenas 1 coluna */
            grid-template-columns: 1fr; 
        }
        .nav-button {
            /* Dá mais altura para ser mais fácil de clicar */
            height: 120px; 
        }
    }
</style>
<body>

    <h1>Escolha a Coleção que Deseja Visualizar</h1>

    <div class="nav-container">
        
        <a href="funko-pop-inventory.html" class="nav-button" title="Inventário Funko Pop!">
            <img src="https://i.imgur.com/1vIdlaA.png" 
                 alt="Logo Funko Pop" 
                 class="logo-img">
        </a>

        <a href="hot-wheels-inventory.html" class="nav-button" title="Inventário Hot Wheels">
            <img src="https://i.imgur.com/UqptwaH.png" 
                 alt="Logo Hot Wheels" 
                 class="logo-img">
        </a>
        
        </div>

</body>
