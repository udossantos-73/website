<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal da Coleção - Pops & Hot Wheels</title>
    
    <style>
    body { 
        font-family: Arial, sans-serif; 
        background-color: #f4f4f4; 
        margin: 0; 
        padding: 0; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        min-height: 100vh; 
        color: #333; 
    }

    .portal-card { 
        background: #ffffff; 
        padding: 40px; 
        border-radius: 12px; 
        box-shadow: 0 8px 24px rgba(0,0,0,0.1); 
        text-align: center; 
        max-width: 450px; 
        width: 90%; 
    }

    h1 { color: #007acc; margin-bottom: 10px; font-size: 1.8rem; }
    p { color: #64748b; margin-bottom: 25px; line-height: 1.5; }

    .auth-button { 
        padding: 12px 24px; 
        font-size: 1rem; 
        color: white; 
        background-color: #007acc; 
        border: none; 
        border-radius: 6px; 
        cursor: pointer; 
        font-weight: bold; 
        transition: background-color 0.2s;
        width: 100%;
        box-sizing: border-box;
    }
    .auth-button:hover { background-color: #005999; }

    .nav-button {
        display: inline-block;
        padding: 14px 28px;
        font-size: 1rem;
        color: white;
        background-color: #10b981;
        border-radius: 6px;
        text-decoration: none;
        font-weight: bold;
        transition: background-color 0.2s;
        margin-top: 12px;
        width: 100%;
        box-sizing: border-box;
    }
    .nav-button:hover { background-color: #059669; }

    .nav-button.gallery-btn {
        background-color: #8b5cf6;
    }
    .nav-button.gallery-btn:hover { background-color: #7c3aed; }

    .nav-button.stats-btn {
        background-color: #0284c7;
    }
    .nav-button.stats-btn:hover { background-color: #0369a1; }

    .user-info { 
        background: #f8fafc; 
        padding: 15px; 
        border-radius: 8px; 
        border: 1px solid #e2e8f0; 
        margin-bottom: 20px; 
        word-break: break-all;
    }
    .user-email { font-weight: bold; color: #1e293b; }

    .logout-btn {
        background-color: #dc3545;
        margin-top: 15px;
    }
    .logout-btn:hover { background-color: #bb2d3b; }
    </style>
</head>
<body>

<div class="portal-card">
    <h1>Coleção de Pops & Hot Wheels</h1>
    <p>Bem-vindo ao portal de gestão e consulta do inventário de colecionáveis.</p>

    <!-- ÁREA DE AUTENTICAÇÃO -->
    <div id="auth-section">
        <button id="login-btn" class="auth-button" onclick="login()">Entrar com Google</button>
        
        <div id="user-details" style="display:none;">
            <div class="user-info">
                <span>Sessão iniciada como:</span><br>
                <span class="user-email" id="user-email"></span>
            </div>

            <!-- OPÇÕES DE NAVEGAÇÃO -->
            <a href="inventario.html" class="nav-button">&rarr; Ver Tabela de Inventário</a>
            <a href="funko.html" class="nav-button gallery-btn">&rarr; Ver Galeria Visual Funko</a>
            
            <!-- BOTÃO DE ESTATÍSTICAS (OCULTO POR OMISSÃO, VISÍVEL APENAS PARA O ULISSES) -->
            <a href="estatisticas.html" id="admin-stats-btn" class="nav-button stats-btn" style="display:none;">&rarr; Ver Valor & Estatísticas</a>

            <button class="auth-button logout-btn" onclick="logout()">Sair</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCDbqy7cBEBkIkhiD4dzbhVKq4leduVEYE",
    authDomain: "miguel-inventory.firebaseapp.com",
    projectId: "miguel-inventory",
    storageBucket: "miguel-inventory.firebasestorage.app",
    messagingSenderId: "277968569414",
    appId: "1:277968569414:web:04884bc1932c2c7dbb6b647"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

const authorizedEmails = [
    "ulisses.dos.santos@gmail.com",
    "urbino.sousa@gmail.com",
    "miguelabrantesdossantos@gmail.com"
];

// E-mail do Administrador (Ulisses)
const ADMIN_EMAIL = "ulisses.dos.santos@gmail.com";

function login() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch((error) => {
        auth.signInWithRedirect(provider);
    });
}

function logout() {
    auth.signOut().then(() => { location.reload(); });
}

auth.onAuthStateChanged((user) => {
    if (user) {
        const userEmail = (user.email || "").toLowerCase().trim();
        if (authorizedEmails.includes(userEmail)) {
            document.getElementById('login-btn').style.display = 'none';
            document.getElementById('user-details').style.display = 'block';
            document.getElementById('user-email').innerText = user.email;

            // Mostra o botão de estatísticas EXCLUSIVAMENTE para o e-mail do Ulisses
            if (userEmail === ADMIN_EMAIL) {
                document.getElementById('admin-stats-btn').style.display = 'block';
            } else {
                document.getElementById('admin-stats-btn').style.display = 'none';
            }
        } else {
            alert("Acesso Negado!\n\nO email (" + user.email + ") não tem permissão de acesso.");
            auth.signOut();
        }
    } else {
        document.getElementById('login-btn').style.display = 'block';
        document.getElementById('user-details').style.display = 'none';
        document.getElementById('admin-stats-btn').style.display = 'none';
    }
});
</script>

</body>
</html>
