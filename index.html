<style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f4; }
    h1 { color: #007acc; }
    .nav-container { margin-top: 30px; }

    /* Estilo do Botão/Área de Link */
    .nav-button {
        display: inline-block;
        padding: 10px; 
        margin: 10px;
        text-decoration: none;
        
        /* ALTERAÇÃO CRÍTICA: Define o fundo como branco sólido */
        background-color: white; 
        
        border: 2px solid #ccc;
        border-radius: 8px;
        /* Define um tamanho FIXO para a área do botão para consistência */
        width: 220px; 
        height: 150px;
        
        /* Centraliza a imagem verticalmente dentro do botão */
        display: flex;
        align-items: center; /* Centraliza verticalmente */
        justify-content: center; /* Centraliza horizontalmente */
        
        transition: border-color 0.3s, box-shadow 0.3s;
    }
    .nav-button:hover {
        border-color: #007acc; 
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    
    /* Estilo para a Imagem do Logo */
    .logo-img {
        /* ALTERAÇÃO CRÍTICA: Define um tamanho MÁXIMO consistente para todas as imagens */
        max-width: 100%; 
        max-height: 100%; /* Garante que a imagem se encaixa no tamanho fixo do botão */
        width: auto;
        height: auto;
        display: block; 
        object-fit: contain; /* Garante que a imagem é redimensionada sem ser cortada */
    }
</style>
<body>

    <h1>Escolha a Coleção que Deseja Visualizar</h1>

    <div class="nav-container">
        
        <a href="funko-pop-inventory.html" class="nav-button" title="Inventário Funko Pop!">
            <img src="https://i.imgur.com/1vIdlaA.png" 
                 alt="Logo Funko Pop" 
                 class="logo-img">
        </a>

        <a href="hot-wheels-inventory.html" class="nav-button" title="Inventário Hot Wheels">
            <img src="https://i.imgur.com/UqptwaH.png" 
                 alt="Logo Hot Wheels" 
                 class="logo-img">
        </a>
        
        </div>

</body>
