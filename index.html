tario<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Tal Coleção do Miguel</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
    body {
        margin: 0;
        font-family: 'Montserrat', sans-serif;
        background-color: #f8f9fa;
        color: #333;
    }

    /* Header */
    header {
        position: relative;
        height: 400px;
        background: url('https://i.imgur.com/oJ1qqf9.png') center center / cover no-repeat fixed;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        text-align: center;
        overflow: hidden;
    }

    header::after {
        content: "";
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.4);
    }

    header h1 {
        position: relative;
        font-size: 3em;
        z-index: 1;
        margin: 0;
        letter-spacing: 2px;
        text-shadow: 2px 2px 15px rgba(0,0,0,0.5);
    }

    /* Botões */
    .button-group {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
        margin-top: 30px;
    }

    .btn {
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        width: 200px;
        height: 60px;
        background: #ffdd59;
        color: #007acc;
        font-weight: 700;
        text-decoration: none;
        border-radius: 8px;
        transition: all 0.3s ease;
        font-size: 1.2em;
    }

    .btn:hover {
        background: #ffe87f;
        transform: translateY(-3px);
        box-shadow: 0px 4px 12px rgba(0,0,0,0.15);
    }

    /* Gallery */
    /* --- ESTILOS BASE (DESKTOP/TABLET) --- */
.gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    padding: 60px 20px;
    max-width: 1200px;
    margin: auto;
    justify-content: center;
}

.item-card {
    display: flex;
    flex-direction: column; /* Desktop: Imagem em cima, texto em baixo */
    width: 250px;
    border: 2px solid #eee;
    border-radius: 12px;
    overflow: hidden;
    background: white;
    text-decoration: none;
    color: inherit;
    transition: all 0.3s ease;
}

.item-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

/* --- ESTILO MOBILE FORÇADO (IPHONE 11 PRO MAX E OUTROS) --- */
@media (max-width: 500px) {
    .gallery {
        flex-direction: column; /* Empilha as linhas */
        padding: 20px 10px;
        gap: 15px;
    }

    .item-card {
        flex-direction: row !important; /* FORÇA LADO A LADO */
        width: 100% !important; /* Ocupa a largura toda como uma linha */
        height: 100px;
        align-items: center;
    }

    .item-card img {
        width: 100px !important; /* Largura fixa da miniatura */
        height: 100% !important;
        flex-shrink: 0;
    }

    .item-title {
        padding: 0 15px !important;
        font-size: 1.1em !important;
        text-align: left;
    }

    .item-desc {
        display: none !important; /* Esconde a descrição para caber na linha */
    }
}

    /* Responsividade */
    @media (max-width: 1024px) {
        header h1 {
            font-size: 2.5em;
        }
        .btn {
            width: 180px;
            height: 55px;
            font-size: 1.1em;
        }
        .item-card img {
            height: 160px;
        }
    }

    @media (max-width: 768px) {
        header h1 {
            font-size: 2em;
        }
        .btn {
            width: 45%; /* Dois botões por linha */
            height: 50px;
            font-size: 1em;
        }
        .gallery {
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            padding: 50px 15px;
            gap: 15px;
        }
        .item-card img {
            height: 140px;
        }
    }

/* Abrangendo iPhones maiores e dispositivos até 480px */
@media (max-width: 500px) {
    header {
        height: 280px;
    }
    
    header h1 {
        font-size: 1.8em;
        padding: 0 10px;
    }

    .btn {
        width: 85%;
        height: 50px;
        font-size: 1em;
    }

    /* Transformação da Galeria em Lista de Linhas */
    .gallery {
        display: flex; /* Mudamos de Grid para Flex para melhor controlo */
        flex-direction: column;
        padding: 30px 15px;
        gap: 12px;
    }

    .item-card {
        display: flex !important; /* Força o alinhamento horizontal */
        flex-direction: row; 
        align-items: center;
        text-align: left;
        height: 90px;
        background: white;
        border: 1px solid #ddd;
        text-decoration: none;
    }

    .item-card img {
        width: 100px !important; /* Tamanho fixo da miniatura */
        height: 100% !important;
        object-fit: cover;
        flex-shrink: 0;
    }

    .item-card .item-title {
        padding: 0 15px;
        font-size: 1.1em;
        font-weight: 700;
        color: #007acc;
        flex-grow: 1; /* Faz o título ocupar o espaço restante */
    }

    .item-card .item-desc {
        display: none; /* Remove a descrição para não amontoar no iPhone */
    }
}
</style>
</head>
<body>

<header>
    <h1>Explorar as Coleções</h1>
    <div class="button-group">
        <a href="formulario.html" class="btn">Inserir Item</a>
        <a href="inventario.html" class="btn">Ver Inventário</a>
    </div>
</header>

<section class="gallery">
    <a <a href="funko.html" class="item-card">
        <img src="https://i.imgur.com/KK35pih.png" alt="Funko Pop">
        <div class="item-title">Funko Pop!</div>
        <div class="item-desc">Veja todos os itens disponíveis desta marca.</div>
    </a>
    <a href="" class="item-card">
        <img src="https://i.imgur.com/UqptwaH.png" alt="Hot Wheels">
        <div class="item-title">Hot Wheels</div>
        <div class="item-desc">Explore os modelos e variantes desta marca.</div>
    </a>
</section>

<script>
    // Animação ao scroll
    const cards = document.querySelectorAll('.item-card');
    const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if(entry.isIntersecting) {
                entry.target.classList.add('visible');
            }
        });
    }, { threshold: 0.1 });
    cards.forEach(card => observer.observe(card));
</script>

</body>
</html>
